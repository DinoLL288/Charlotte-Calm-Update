<!DOCTYPE html>
<html lang="en">
<head>
  <script src="site-shell-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Project Lover Boy</title>
  <script>
    if (!localStorage.getItem('charlotte-user')) {
      window.location.href = 'login.html';
    }
  </script>
  <style>
    /* A quiet room: one photo, one heart. */
    body { color: #ffffff; background: #16324a; }

    .backdrop { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: #16324a; }
    .backdrop-photo { position: absolute; inset: 0; background: url("holding-hands.jpg") center 35% / cover no-repeat; }
    .backdrop-photo::after { content: ""; position: absolute; inset: 0; background: rgba(18, 40, 58, 0.72); }

    .top-bar { position: fixed; top: 12px; left: 12px; z-index: 25; }

    main { width: min(560px, 100%); margin: 0 auto; }

    .screen {
      box-sizing: border-box;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 12px;
      min-height: 100svh;
      padding: 84px 22px calc(110px + env(safe-area-inset-bottom, 0px));
      text-align: center;
    }
    .screen.hidden { display: none; }

    .screen .eyebrow { color: #ecd7a0; font-family: var(--font-display); font-style: italic; font-weight: 400; font-size: 1rem; }
    .screen h1 { margin: 0; color: #ffffff; font-size: clamp(2.4rem, 9vw, 3.6rem); line-height: 1.1; text-shadow: none; }
    .screen .subtitle { margin: 0; color: rgba(255, 255, 255, 0.88) !important; font-size: 1.05rem; }
    .memory-sub { margin: 0; color: rgba(255, 255, 255, 0.85); }
    .word { display: inline-block; }

    /* ---------- The heart ---------- */
    .heart-button {
      position: relative;
      display: block;
      width: min(250px, 66vw);
      margin: 14px auto 8px;
      padding: 0;
      border: 0;
      color: inherit;
      background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .heart-svg { display: block; width: 100%; height: auto; overflow: visible; }
    .heart-line { fill: none; stroke: #ecd7a0; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 0; }
    .heart-text {
      position: absolute;
      inset: 0 0 12% 0;
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-style: italic;
      font-size: clamp(1.15rem, 4.6vw, 1.45rem);
      color: #ffffff;
      transition: opacity 0.35s ease;
    }
    .heart-text.is-swapping { opacity: 0; }
    .tap-hint { margin: 0; min-height: 1.4em; color: rgba(255, 255, 255, 0.7); font-size: 0.9rem; transition: opacity 0.5s ease; }
    .tap-hint.is-gone { opacity: 0; }

    .spark { position: absolute; left: 50%; top: 42%; z-index: 2; pointer-events: none; line-height: 1; }

    .together-since { margin: 0; color: rgba(255, 255, 255, 0.75); font-size: 0.9rem; }
    .together-block { display: grid; gap: 14px; margin-top: 10px; color: #ffffff; }

    .pill {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 46px; padding: 0.65rem 1.4rem;
      border: 1px solid transparent; border-radius: 999px;
      color: var(--ink); background: #ffffff;
      font: 600 0.98rem/1.2 var(--font-body); cursor: pointer;
    }
    .pill:hover { background: #eef5f9; }
    .pill.quiet { color: #ffffff; background: transparent; border-color: rgba(255, 255, 255, 0.45); }
    .pill.quiet:hover { background: rgba(255, 255, 255, 0.12); }
    .pill[hidden] { display: none; }
    .reveal-button { margin-top: 12px; }

    /* ---------- Photo reel ---------- */
    .reel { position: relative; width: min(460px, 100%); aspect-ratio: 4 / 3; margin: 14px auto 4px; overflow: hidden; border-radius: var(--r-lg); background: #0f2538; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35); }
    .reel.is-empty { display: none; }
    .reel-backdrop { position: absolute; inset: -24px; background: center / cover no-repeat; filter: blur(22px) brightness(0.7); }
    .reel img { position: relative; display: block; width: 100%; height: 100%; object-fit: contain; }
    .reel-count { position: absolute; right: 12px; bottom: 10px; padding: 3px 11px; border-radius: 999px; color: #ffffff; background: rgba(0, 0, 0, 0.42); font-size: 0.8rem; }
    .photo-caption { margin: 0; color: rgba(255, 255, 255, 0.88); }
    .reel-empty { margin: 0; color: rgba(255, 255, 255, 0.85); }
    .reel-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 10px; }

    /* ---------- Motion: each thing arrives once, then rests ---------- */
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes fill-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes beat { 0% { transform: scale(1); } 18% { transform: scale(1.07); } 34% { transform: scale(1); } 52% { transform: scale(1.045); } 72%, 100% { transform: scale(1); } }
    @keyframes photo-settle { from { transform: scale(1.08); } to { transform: scale(1); } }
    @keyframes rise {
      0% { opacity: 0; transform: translate(-50%, 0) scale(0.4) rotate(0deg); }
      18% { opacity: 1; }
      100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), var(--dy)) scale(1) rotate(var(--r)); }
    }
    @keyframes reelFade { from { opacity: 0; transform: scale(1.03); } to { opacity: 1; transform: none; } }
    @keyframes leave { to { opacity: 0; transform: translateY(-8px); } }

    .reel-fade { animation: reelFade 0.8s var(--ease-out); }
    .is-leaving { animation: leave 0.26s ease-in forwards; }

    @media (prefers-reduced-motion: no-preference) {
      .backdrop-photo { animation: photo-settle 3s var(--ease-out) both; }
      .screen .eyebrow { animation: focus-in 0.9s var(--ease-out) 0.1s backwards; }
      .screen h1 .word { animation: focus-in 0.95s var(--ease-out) backwards; animation-delay: calc(var(--i) * 120ms + 220ms); }
      .screen .subtitle, .memory-sub { animation: focus-in 0.9s var(--ease-out) 0.7s backwards; }
      .heart-line { animation: draw 1.9s var(--ease-soft) 0.5s backwards; }
      .heart-fill { animation: fill-in 1.2s ease-out 1.8s backwards; }
      .heart-text { animation: fill-in 1s ease-out 2.4s backwards; }
      .heart-svg { animation: beat 1.4s ease-out 2.6s; transform-origin: 50% 55%; }
      .heart-svg.is-beating { animation: beat 1.1s ease-out; }
      .tap-hint { animation: fill-in 1s ease-out 3.4s backwards; }
      .together-block { animation: focus-in 0.9s var(--ease-out) 1.1s backwards; }
      .reveal-button { animation: focus-in 0.9s var(--ease-out) 1.4s backwards; }
      .spark { animation: rise var(--t, 1.7s) var(--ease-out) forwards; }
      .is-entering { animation: settle-in 0.7s var(--ease-out); }
      .pill { transition: transform 0.35s var(--ease-spring), background-color 0.2s ease; }
      .pill:active { transform: scale(0.97); transition-duration: 0.08s; }
    }

    @media (prefers-reduced-motion: reduce) { .spark { display: none; } }
  </style>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="site-polish.css" data-site-polish="true"><link rel="stylesheet" href="site-theme.css" data-site-theme="true"><link rel="stylesheet" href="motion.css">
</head>

<body>
  <div class="backdrop" aria-hidden="true"><div class="backdrop-photo"></div></div>

  <div class="top-bar">
    <a class="button" href="index.html">← Back to hub</a>
  </div>

  <main>
    <section class="screen opening" id="opening">
      <p class="eyebrow">Charlotte &amp; Luke</p>
      <h1 id="heading"><span class="word" style="--i:0">I</span> <span class="word" style="--i:1">love</span> <span class="word" style="--i:2">you</span></h1>
      <p class="subtitle">A little celebration of us.</p>

      <button class="heart-button" id="heart" type="button" aria-label="Our love. Tap for a little more.">
        <svg class="heart-svg" id="heartSvg" viewBox="0 0 200 180" aria-hidden="true">
          <defs>
            <linearGradient id="heartFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
              <stop offset="1" stop-color="#ecd7a0" stop-opacity="0.14"/>
            </linearGradient>
          </defs>
          <path class="heart-fill" fill="url(#heartFill)" d="M100 168C40 120 8 88 8 52 8 26 28 8 54 8c20 0 36 10 46 26 10-16 26-26 46-26 26 0 46 18 46 44 0 36-32 68-92 116z"/>
          <path class="heart-line" pathLength="1" d="M100 168C40 120 8 88 8 52 8 26 28 8 54 8c20 0 36 10 46 26 10-16 26-26 46-26 26 0 46 18 46 44 0 36-32 68-92 116z"/>
        </svg>
        <span class="heart-text" id="heartText">Us, always</span>
      </button>
      <p class="tap-hint" id="tapHint">Tap the heart</p>

      <div class="together-block">
        <div class="together" data-together role="timer" aria-label="Time we have been together"></div>
        <p class="together-since">Since 26 October 2026 · 5:46 pm</p>
      </div>
      <button class="pill reveal-button" id="revealButton" type="button">One more thing…</button>
    </section>

    <section class="screen memory hidden" id="memory">
      <p class="eyebrow">One more thing</p>
      <h1>A few more of us</h1>
      <p class="memory-sub">Pulled from our gallery of favorite moments.</p>
      <div class="reel" id="reelWrap">
        <div class="reel-backdrop" id="reelBackdrop" aria-hidden="true"></div>
        <img id="reelPhoto" alt="A photo of us from the gallery">
        <span class="reel-count" id="reelCount"></span>
      </div>
      <p class="photo-caption" id="reelCaption">Finding a memory…</p>
      <p class="reel-empty" id="reelEmpty" hidden>No photos in the gallery yet. Add a few and they'll show up here.</p>
      <div class="reel-actions">
        <button class="pill" id="nextMemory" type="button">Another one →</button>
        <button class="pill quiet" id="backButton" type="button">Back to the heart</button>
      </div>
    </section>
  </main>

  <script>
    const reduceMotion = () =>
      window.matchMedia('(prefers-reduced-motion: reduce)').matches || document.documentElement.dataset.reducedMotion === 'true';

    /* ---------- The heart: tap for a pulse, a few small hearts, and a new line ---------- */
    const heartButton = document.getElementById("heart");
    const heartSvg = document.getElementById("heartSvg");
    const heartText = document.getElementById("heartText");
    const tapHint = document.getElementById("tapHint");
    const phrases = ["Us, always", "Our love 🤍", "I love you", "Us, always"];
    let phraseIndex = 0;

    function sparks() {
      if (reduceMotion()) return;
      const live = heartButton.querySelectorAll(".spark").length;
      const count = Math.min(7, 24 - live);
      for (let i = 0; i < count; i++) {
        const spark = document.createElement("span");
        spark.className = "spark";
        spark.textContent = "🤍";
        spark.style.fontSize = 14 + Math.random() * 14 + "px";
        spark.style.setProperty("--dx", (Math.random() * 150 - 75).toFixed(0) + "px");
        spark.style.setProperty("--dy", (-90 - Math.random() * 110).toFixed(0) + "px");
        spark.style.setProperty("--r", (Math.random() * 50 - 25).toFixed(0) + "deg");
        spark.style.setProperty("--t", (1.4 + Math.random() * 0.7).toFixed(2) + "s");
        spark.style.animationDelay = (i * 55) + "ms";
        spark.addEventListener("animationend", () => spark.remove());
        heartButton.appendChild(spark);
      }
    }

    heartButton.addEventListener("click", () => {
      heartSvg.classList.remove("is-beating");
      void heartSvg.getBoundingClientRect();
      heartSvg.classList.add("is-beating");
      sparks();

      phraseIndex = (phraseIndex + 1) % phrases.length;
      heartText.classList.add("is-swapping");
      setTimeout(() => {
        heartText.textContent = phrases[phraseIndex];
        heartText.classList.remove("is-swapping");
      }, 260);

      tapHint.classList.add("is-gone");
    });

    /* ---------- Moving between the two screens ---------- */

    function swapScreens(from, to, done) {
      const enter = () => {
        from.classList.add("hidden");
        from.classList.remove("is-leaving");
        to.classList.remove("hidden");
        window.scrollTo(0, 0);
        if (!reduceMotion()) {
          to.classList.add("is-entering");
          setTimeout(() => to.classList.remove("is-entering"), 800);
        }
        if (done) done();
      };
      if (reduceMotion()) { enter(); return; }
      from.classList.add("is-leaving");
      setTimeout(enter, 260);
    }

    const opening = document.getElementById("opening");
    const memory = document.getElementById("memory");
    const reelWrap = document.getElementById("reelWrap");
    const reelBackdrop = document.getElementById("reelBackdrop");
    const reelPhoto = document.getElementById("reelPhoto");
    const reelCount = document.getElementById("reelCount");
    const reelCaption = document.getElementById("reelCaption");
    const reelEmpty = document.getElementById("reelEmpty");
    const nextMemory = document.getElementById("nextMemory");

    let reelPhotos = [];
    let reelIndex = 0;
    let reelLoaded = false;

    // Shuffle a copy in place so every visit starts somewhere new.
    function shuffleReel(avoidFirst) {
      for (let i = reelPhotos.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const swap = reelPhotos[i];
        reelPhotos[i] = reelPhotos[j];
        reelPhotos[j] = swap;
      }
      // When the reel loops, never let the same photo follow itself.
      if (avoidFirst && reelPhotos.length > 1 && reelPhotos[0] === avoidFirst) {
        const j = 1 + Math.floor(Math.random() * (reelPhotos.length - 1));
        const swap = reelPhotos[0];
        reelPhotos[0] = reelPhotos[j];
        reelPhotos[j] = swap;
      }
    }

    // The frame keeps a steady 4:3 shape and the photo is fully contained inside it,
    // with a blurred copy filling the extra space. Nothing gets cropped.
    function showReelPhoto() {
      if (!reelPhotos.length) return;
      const photo = reelPhotos[reelIndex];

      reelPhoto.src = photo.url;
      reelPhoto.alt = photo.uploadedBy
        ? "A photo of us, added by " + photo.uploadedBy
        : "A photo of us from the gallery";
      reelBackdrop.style.backgroundImage = 'url("' + photo.url.replace(/"/g, '\\"') + '")';
      reelCount.textContent = (reelIndex + 1) + " / " + reelPhotos.length;
      reelCaption.textContent = "A little more us.";

      [reelPhoto, reelBackdrop].forEach(el => {
        el.classList.remove("reel-fade");
        void el.offsetWidth;
        el.classList.add("reel-fade");
      });

      // Preload the next one so "Another one" feels instant.
      if (reelPhotos.length > 1) {
        const preload = new Image();
        preload.src = reelPhotos[(reelIndex + 1) % reelPhotos.length].url;
      }
    }

    async function loadReel() {
      if (reelLoaded) return;
      reelLoaded = true;

      try {
        const foldersRes = await fetch('/api/gallery');
        const foldersJson = await foldersRes.json();
        const folders = Array.isArray(foldersJson.folders) ? foldersJson.folders : [];

        const realFolders = folders
          .filter(folder => folder && folder !== 'All Photos')
          .map(folder => folder === 'Old Photos' ? 'root' : folder);

        const lists = await Promise.all(realFolders.map(async folder => {
          try {
            const res = await fetch('/api/gallery?folder=' + encodeURIComponent(folder));
            const json = await res.json();
            return Array.isArray(json.photos) ? json.photos : [];
          } catch (e) {
            return [];
          }
        }));

        const imagePattern = /\.(jpe?g|png|gif|webp|avif)$/i;
        const seen = new Set();
        reelPhotos = lists.flat().filter(photo => {
          if (!photo || !photo.url) return false;
          if (!imagePattern.test(photo.name || photo.url)) return false;
          // The same picture can be stored twice under different names (or in two
          // folders), so compare by GitHub's content hash as well as the URL.
          const key = photo.sha || photo.path || photo.url;
          if (seen.has(key) || seen.has(photo.url)) return false;
          seen.add(key);
          seen.add(photo.url);
          return true;
        });

        if (!reelPhotos.length) {
          throw new Error('empty');
        }

        reelWrap.classList.remove('is-empty');
        reelEmpty.hidden = true;
        nextMemory.hidden = reelPhotos.length < 2;
        shuffleReel();
        reelIndex = 0;
        showReelPhoto();
      } catch (e) {
        reelWrap.classList.add('is-empty');
        reelCaption.textContent = '';
        reelEmpty.hidden = false;
        nextMemory.hidden = true;
        reelBackdrop.style.backgroundImage = '';
      }
    }

    document.getElementById("revealButton").addEventListener("click", () => {
      swapScreens(opening, memory, () => {
        // Every time the reel is opened it gets a fresh random order.
        if (reelLoaded && reelPhotos.length) {
          shuffleReel();
          reelIndex = 0;
          showReelPhoto();
        } else {
          loadReel();
        }
      });
    });

    document.getElementById("backButton").addEventListener("click", () => {
      swapScreens(memory, opening);
    });

    nextMemory.addEventListener("click", () => {
      if (reelPhotos.length < 2) return;
      const current = reelPhotos[reelIndex];
      reelIndex += 1;

      // Reached the end of this shuffled lap: shuffle again for the next one.
      if (reelIndex >= reelPhotos.length) {
        shuffleReel(current);
        reelIndex = 0;
      }

      showReelPhoto();
    });
  </script>
  <script src="together.js"></script>
  <script src="avatar.js"></script>
</body>
</html>
