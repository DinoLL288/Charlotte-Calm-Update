<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Charlotte &amp; Luke</title>
  <script>if (!localStorage.getItem('charlotte-user')) location.replace('login.html');</script>
  <link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="site-polish.css"><link rel="stylesheet" href="site-theme.css"><link rel="stylesheet" href="motion.css">
  <style>
    html,body{width:100%;height:100%;min-height:100%;margin:0;overflow:hidden;background:#f3f6f8}
    #siteFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent;opacity:0;transform:translateY(10px);filter:blur(5px);transition:opacity .45s cubic-bezier(.22,1,.36,1),transform .45s cubic-bezier(.22,1,.36,1),filter .45s cubic-bezier(.22,1,.36,1)}
    #siteFrame.is-visible{opacity:1;transform:none;filter:none}
    body.is-navigating #siteFrame{opacity:0;transform:scale(.99);filter:blur(3px);transition-duration:.18s}
    /* A thin line sweeps across the top only if a page takes more than a moment to arrive. */
    #navProgress{position:fixed;top:0;left:0;z-index:50;width:38%;height:2px;background:var(--accent,#2c6e92);opacity:0;pointer-events:none}
    body.is-navigating #navProgress{opacity:.85;animation:progress-sweep 1.1s ease-in-out .3s infinite}
    @media(prefers-reduced-motion:reduce){#siteFrame,body.is-navigating #siteFrame{transition:none;filter:none;transform:none}#navProgress{display:none}}
  </style>
</head>
<body>
  <div id="navProgress" aria-hidden="true"></div>
  <iframe id="siteFrame" title="Charlotte and Luke website" allow="autoplay; encrypted-media; clipboard-write; fullscreen; picture-in-picture"></iframe>
  <script src="site-theme.js"></script><script src="site-shell.js"></script><script src="presence.js"></script>
</body>
</html>
