<!DOCTYPE html>
<html lang="en">
<head>
  <script src="site-shell-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes</title>
  <script>
    if (!localStorage.getItem('charlotte-user')) {
      window.location.href = 'login.html';
    }
  </script>
  <style>
    :root { --sky: #a4deff; --deep-blue: #245b85; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", Arial, sans-serif;
      background: linear-gradient(145deg, #c8edff, var(--sky) 55%, #8ccfff);
      color: var(--deep-blue);
    }
    .screen {
      width: min(900px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 80px 18px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
    }
    h1 { margin: 0; color: #fff; font-size: clamp(2rem, 6vw, 3.6rem); text-shadow: 0 3px 14px #428ec080; }
    .subtitle { margin: 0; color: #fff; font-size: clamp(1rem, 3vw, 1.2rem); text-shadow: 0 2px 8px #428ec080; }
    .composer {
      width: min(720px, 92vw);
      background: #ffffffee;
      border-radius: 18px;
      box-shadow: 0 12px 30px #347eac30;
      padding: clamp(16px, 4vw, 24px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }
    .composer input, .composer textarea, .composer select {
      width: 100%;
      border-radius: 12px;
      border: 1px solid #b9dcf5;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 1rem;
    }
    .composer select { background: #fff; color: var(--deep-blue); }
    .composer textarea { min-height: 120px; resize: vertical; }
    .composer-label { font-weight: 700; color: #2873a6; font-size: 0.95rem; }
    .composer-hint { margin: -4px 0 0; color: #3b7db3; font-size: 0.85rem; }
    .button {
      align-self: flex-start;
      border: 0;
      border-radius: 999px;
      padding: 12px 22px;
      background: white;
      color: #2873a6;
      font-size: 0.98rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 7px 20px #347eac35;
      cursor: pointer;
    }
    .notes {
      width: min(720px, 92vw);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .note {
      background: #ffffffee;
      border-radius: 16px;
      box-shadow: 0 12px 30px #347eac30;
      padding: 18px 20px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .note-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .note-title { font-weight: 800; color: #2873a6; font-size: 1.1rem; }
    .note-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      color: #3b7db3;
      font-size: 0.9rem;
    }
    .note-lock { color: #2873a6; font-weight: 700; }
    .note-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      background: #e8f6ff;
      box-shadow: 0 3px 10px #347eac30;
      flex: none;
    }
    .note-date { color: #3b7db3; font-size: 0.9rem; }
    .note-body { margin: 0; line-height: 1.7; white-space: pre-wrap; }
    .note-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .note-action { padding: 8px 16px; font-size: 0.9rem; }
    .edit-form { display: flex; flex-direction: column; gap: 10px; }
    .edit-form input, .edit-form textarea {
      width: 100%;
      border-radius: 12px;
      border: 1px solid #b9dcf5;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 1rem;
    }
    .edit-form textarea { min-height: 100px; resize: vertical; }
    .edit-actions { display: flex; gap: 8px; }
    .top-bar { position: fixed; top: 16px; left: 16px; z-index: 5; }
  </style>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="site-polish.css" data-site-polish="true"><link rel="stylesheet" href="site-theme.css" data-site-theme="true"><link rel="stylesheet" href="motion.css">
</head>
<body>
  <div class="top-bar">
    <a class="button" href="index.html">← Back to hub</a>
  </div>
  <main class="screen">
    <h1>Notes</h1>
    <p class="subtitle">Our messages</p>
    <section class="composer">
      <label class="composer-label" for="noteAuthor">Who wrote this note?</label>
      <select id="noteAuthor">
        <option value="Charlotte">Charlotte</option>
        <option value="Luke">Luke</option>
      </select>
      <input id="noteTitle" placeholder="Title">
      <textarea id="noteBody" placeholder="Write a note..."></textarea>
      <p class="composer-hint">Only the writer can delete a note — unless the other person protects it.</p>
      <button class="button" id="addNote">Add note</button>
    </section>
    <div class="notes" id="notesList"></div>
  </main>

  <script>
    const noteTitle = document.getElementById('noteTitle');
    const noteBody = document.getElementById('noteBody');
    const noteAuthor = document.getElementById('noteAuthor');
    const addNote = document.getElementById('addNote');
    const notesList = document.getElementById('notesList');
    let notes = [];
    let currentSha = null;
    let editingNote = null;
    const currentUser = localStorage.getItem('charlotte-user') || 'Unknown';
    const profilePics = {};

    if ([...noteAuthor.options].some(option => option.value === currentUser)) {
      noteAuthor.value = currentUser;
    }

    function fallbackAvatar(user) {
      return 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user || 'Unknown') + '&background=e8f6ff&color=2873a6&size=64';
    }

    async function loadProfilePics(users) {
      await Promise.all([...new Set(users)].map(async user => {
        if (!user || user === 'Unknown' || Object.prototype.hasOwnProperty.call(profilePics, user)) return;

        const cached = localStorage.getItem('charlotte-avatar-' + user);
        if (cached) profilePics[user] = cached;

        try {
          const res = await fetch('/api/profile?user=' + encodeURIComponent(user));
          const json = await res.json();
          if (json.url) {
            profilePics[user] = json.url;
            localStorage.setItem('charlotte-avatar-' + user, json.url);
          } else if (!cached) {
            profilePics[user] = null;
          }
        } catch (e) {
          if (!cached) profilePics[user] = null;
        }
      }));
    }

    function isUnknownAuthor(note) {
      return !note.author || note.author === 'Unknown';
    }

    function canDelete(note) {
      if (note.locked) return false;
      return isUnknownAuthor(note) || note.author === currentUser;
    }

    function canEdit(note) {
      return Boolean(note.id) && (isUnknownAuthor(note) || note.author === currentUser);
    }

    function canLock(note) {
      return Boolean(note.id) && !note.locked &&
        (isUnknownAuthor(note) || note.author !== currentUser);
    }

    function canUnlock(note) {
      return Boolean(note.id) && Boolean(note.locked) && note.lockedBy === currentUser;
    }

    function render() {
      notesList.innerHTML = '';
      notes.slice().reverse().forEach(note => {
        const el = document.createElement('article');
        el.className = 'note';
        const author = note.author || 'Unknown';
        const avatar = profilePics[author] || fallbackAvatar(author);
        const meta = `
          <div class="note-meta">
            <img class="note-avatar" src="${escapeAttr(avatar)}" alt="${escapeAttr(author)}'s profile picture">
            <span>By ${escapeHtml(author)} • ${escapeHtml(note.date || '')}${note.editedAt ? ' • edited ' + escapeHtml(note.editedAt) : ''}</span>
            ${note.locked ? `<span class="note-lock">🔒 ${note.lockedBy === currentUser ? 'Protected by me' : 'Protected by ' + escapeHtml(note.lockedBy || 'the other person')}</span>` : ''}
          </div>
        `;

        if (editingNote === note) {
          el.innerHTML = `
            <div class="note-header">
              <div>
                <div class="note-title">${escapeHtml(note.title || 'Untitled')}</div>
                ${meta}
              </div>
            </div>
            <div class="edit-form">
              <input class="edit-title" maxlength="120" value="${escapeAttr(note.title || '')}" placeholder="Title">
              <textarea class="edit-body" maxlength="5000" placeholder="Write a note...">${escapeHtml(note.body || '')}</textarea>
            </div>
            <div class="edit-actions">
              <button class="button note-action save-edit" type="button">Save changes</button>
              <button class="button note-action cancel-edit" type="button">Cancel</button>
            </div>
          `;
          el.querySelector('.save-edit').addEventListener('click', () => saveEdit(note, el));
          el.querySelector('.cancel-edit').addEventListener('click', () => {
            editingNote = null;
            render();
          });
          notesList.appendChild(el);
          return;
        }

        el.innerHTML = `
          <div class="note-header">
            <div>
              <div class="note-title">${escapeHtml(note.title || 'Untitled')}</div>
              ${meta}
            </div>
            <div class="note-actions">
              ${canEdit(note) ? '<button class="button note-action edit-note" type="button">Edit</button>' : ''}
              ${canDelete(note) ? '<button class="button note-action delete-note" type="button">Delete</button>' : ''}
              ${canLock(note) ? '<button class="button note-action protect-note" type="button" title="Stop the author from deleting this note">🔒 Protect</button>' : ''}
              ${canUnlock(note) ? '<button class="button note-action unlock-note" type="button" title="Allow the author to delete this note again">🔓 Unlock</button>' : ''}
            </div>
          </div>
          <p class="note-body">${escapeHtml(note.body)}</p>
        `;
        const editButton = el.querySelector('.edit-note');
        if (editButton) {
          editButton.addEventListener('click', () => {
            editingNote = note;
            render();
          });
        }
        const deleteButton = el.querySelector('.delete-note');
        if (deleteButton) {
          deleteButton.addEventListener('click', () => deleteNote(note));
        }
        const protectButton = el.querySelector('.protect-note');
        if (protectButton) {
          protectButton.addEventListener('click', () => setLock(note, true));
        }
        const unlockButton = el.querySelector('.unlock-note');
        if (unlockButton) {
          unlockButton.addEventListener('click', () => setLock(note, false));
        }
        notesList.appendChild(el);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function escapeAttr(text) {
      return String(text == null ? '' : text)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    async function loadNotes() {
      try {
        const res = await fetch('/api/notes');
        const json = await res.json();
        notes = json.notes || [];
        currentSha = json.sha || null;
        editingNote = null;
        await loadProfilePics(notes.map(note => note.author || 'Unknown'));
        render();
      } catch (e) {
        notes = [];
        render();
      }
    }

    async function deleteNote(note) {
      if (!await siteDialog.confirm('Delete this note?')) return;
      try {
        const res = await fetch('/api/notes', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ action: 'delete', id: note.id, note, currentUser, sha: currentSha })
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Failed to delete');
        currentSha = json.sha || currentSha;
        const index = notes.indexOf(note);
        if (index !== -1) notes.splice(index, 1);
        editingNote = null;
        render();
      } catch (e) {
        siteDialog.alert(e.message);
      }
    }

    async function saveEdit(note, el) {
      const title = el.querySelector('.edit-title').value.trim();
      const body = el.querySelector('.edit-body').value.trim();
      if (!body) {
        siteDialog.alert('Write something first');
        return;
      }

      const saveButton = el.querySelector('.save-edit');
      saveButton.disabled = true;
      try {
        const res = await fetch('/api/notes', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ action: 'edit', id: note.id, note: { title, body }, currentUser, sha: currentSha })
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Failed to save');
        currentSha = json.sha || currentSha;
        note.title = title;
        note.body = body;
        note.editedAt = (json.note && json.note.editedAt) || new Date().toLocaleString();
        editingNote = null;
        render();
      } catch (e) {
        siteDialog.alert(e.message);
        saveButton.disabled = false;
      }
    }

    async function setLock(note, lock) {
      const message = lock
        ? 'Protect this note so the author cannot delete it?'
        : 'Unlock this note and let the author delete it again?';
      if (!await siteDialog.confirm(message)) return;

      try {
        const res = await fetch('/api/notes', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ action: lock ? 'lock' : 'unlock', id: note.id, currentUser, sha: currentSha })
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Failed to update');

        currentSha = json.sha || currentSha;
        const updated = json.note || {};
        if (updated.locked) {
          note.locked = true;
          note.lockedBy = updated.lockedBy || currentUser;
          note.lockedAt = updated.lockedAt || '';
        } else {
          delete note.locked;
          delete note.lockedBy;
          delete note.lockedAt;
        }
        render();
      } catch (e) {
        siteDialog.alert(e.message);
      }
    }

    addNote.addEventListener('click', async () => {
      const title = noteTitle.value.trim();
      const body = noteBody.value.trim();
      if (!body) return;
      const note = {
        id: Date.now().toString() + '-' + Math.random().toString(36).slice(2),
        title,
        body,
        date: new Date().toLocaleString(),
        author: noteAuthor.value
      };
      addNote.disabled = true;
      try {
        const res = await fetch('/api/notes', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ note, sha: currentSha })
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Failed to save');
        currentSha = json.sha || currentSha;
        await loadProfilePics([note.author]);
        notes.push(note);
        editingNote = null;
        noteTitle.value = '';
        noteBody.value = '';
        render();
      } catch (e) {
        siteDialog.alert(e.message);
      } finally {
        addNote.disabled = false;
      }
    });

    loadNotes();
  </script>
  <script src="avatar.js"></script>
  <script src="dialog.js"></script>
</body>
</html>
